<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradingWars</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <h1>TradingWars</h1>
    <button id="loginBtn">Login / Signup</button>
  </nav>

  <main>
    <section id="welcome">
      <h2>Paper Trade • Learn • Compete</h2>
      <p>Join ranked challenges using live stock & crypto data — no real money needed.</p>
      <button id="startBtn">Start Trading</button>
    </section>

    <section id="dashboard" class="hidden">
      <h2>Live Market Dashboard</h2>
      <div id="chart-container"></div>
      <div id="prices"></div>

      <div id="editor-section">
        <h3>Pine-like Strategy Editor</h3>
        <textarea id="pineEditor" placeholder="// Type indicator code..." rows="6"></textarea>
        <button id="runScriptBtn">Run Script</button>
      </div>

      <button id="logoutBtn">Logout</button>
    </section>
  </main>

  <!-- Local Supabase file (important) -->
  <script src="supabase.min.js"></script>

  <!-- Chart library -->
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.min.js"></script>

  <!-- Main logic -->
  <script src="app.js"></script>
</body>
</html>
