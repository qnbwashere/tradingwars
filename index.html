<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradingWars</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <h1>TradingWars</h1>
    <button id="loginBtn">Login / Signup</button>
    <button id="logoutBtn" class="hidden">Logout</button>
  </nav>

  <main>
    <section id="welcome">
      <h2>Paper Trade • Learn • Compete</h2>
      <p>Join ranked challenges with live markets — no real money needed.</p>
      <button id="startBtn">Start</button>
    </section>

    <section id="dashboard" class="hidden">
      <div class="toolbar">
        <select id="symbolSelect">
          <option value="bitcoin">BTC/USD</option>
          <option value="ethereum">ETH/USD</option>
          <option value="aapl">AAPL (Apple)</option>
          <option value="tsla">TSLA (Tesla)</option>
          <option value="gold">Gold (XAU/USD)</option>
        </select>
        <select id="chartType">
          <option value="candlestick">Candlestick</option>
          <option value="line">Line</option>
        </select>
        <button id="pineBtn">Open Pine Editor</button>
      </div>
      <div id="chart-container"></div>
    </section>

    <!-- Pine modal -->
    <div id="pineModal" class="modal hidden">
      <div class="modal-content">
        <span id="closeModal">&times;</span>
        <h3>Pine Editor (Coming Soon)</h3>
        <textarea id="pineEditor" placeholder="// Pine script goes here..."></textarea>
        <button id="runScriptBtn">Run Script</button>
      </div>
    </div>
  </main>

  <script src="supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
